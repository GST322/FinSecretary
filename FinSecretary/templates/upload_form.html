<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка отчёта</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Финансовый секретарь</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/upload">Загрузить</a>
            <a href="/reports">Отчёты</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Загрузка отчёта брокера</h2>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <label for="report">Выберите HTML-файл отчёта:</label>
                <input type="file" id="report" name="report" accept=".html,.htm" required>
                <button type="submit">Загрузить</button>
            </form>
        </section>
    </main>
    <footer><p>&copy; 2026 FinSecretary</p></footer>
</body>
</html>
